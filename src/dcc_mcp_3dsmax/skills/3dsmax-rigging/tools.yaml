tools:
  - name: create_helper_node
    description: Create a host-native helper node such as a point or dummy.
    source_file: action_create_helper_node.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1}
        helper_type: {type: string, enum: [point, dummy, expose_transform, circle], default: point}
        size: {type: number, exclusiveMinimum: 0, default: 10}
        position: &vector_schema
          type: array
          minItems: 3
          maxItems: 3
          items: {type: number}
    output_schema: &output_schema
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: false
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false}

    intent: "Create a helper node such as point, dummy, or expose transform."
    tool_role: action
    risk: medium
    search_aliases: ["create_helper_node", "create helper node", "helper node"]
    side_effects:
      creates: true
      modifies: false
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: []
    produces: ['scene_nodes']
